<% deploy_host = ENV.fetch("DEPLOY_HOST") %>
<% app_host = ENV.fetch("APP_HOST") %>

service: appointment_scheduler
image: lucasluciano92/appointment_scheduler

servers:
  web:
    - <%= deploy_host %>

# Kamal Proxy terminates TLS and renews the Let's Encrypt certificate.
proxy:
  ssl: true
  host: <%= app_host %>
  app_port: 80
  healthcheck:
    path: /up
    interval: 3
    timeout: 3

registry:
  server: ghcr.io
  username: <%= ENV.fetch("KAMAL_REGISTRY_USERNAME", "LucasLuciano92") %>
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  secret:
    - RAILS_MASTER_KEY
<% if ENV["SMTP_ADDRESS"].present? %>
    - SMTP_USERNAME
    - SMTP_PASSWORD
<% end %>
  clear:
    APP_HOST: <%= app_host %>
    API_ALLOWED_ORIGINS: <%= ENV.fetch("API_ALLOWED_ORIGINS", "https://#{app_host}") %>
    MAILER_FROM: <%= ENV.fetch("MAILER_FROM", "turnos@#{app_host}") %>
    BUSINESS_TIME_ZONE: <%= ENV.fetch("BUSINESS_TIME_ZONE", "America/Argentina/Buenos_Aires") %>
    BUSINESS_CURRENCY: <%= ENV.fetch("BUSINESS_CURRENCY", "ARS") %>
    SOLID_QUEUE_IN_PUMA: true
<% if ENV["SMTP_ADDRESS"].present? %>
    SMTP_ADDRESS: <%= ENV.fetch("SMTP_ADDRESS") %>
    SMTP_PORT: <%= ENV.fetch("SMTP_PORT", 587) %>
    SMTP_DOMAIN: <%= ENV.fetch("SMTP_DOMAIN", app_host) %>
    SMTP_AUTHENTICATION: <%= ENV.fetch("SMTP_AUTHENTICATION", "plain") %>
<% end %>

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

# SQLite, Solid Queue, Solid Cache and Active Storage share this persistent
# volume. Back it up from the host as described in docs/stage_7_deploy.md.
volumes:
  - "appointment_scheduler_storage:/rails/storage"

asset_path: /rails/public/assets

builder:
  arch: amd64

ssh:
  user: <%= ENV.fetch("DEPLOY_USER", "root") %>
